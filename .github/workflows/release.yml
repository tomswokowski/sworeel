# Releases SwoReel.
#
# Every push to main updates one open "release" pull request with the next version number and a
# changelog of what has been merged since the last release. Merging that pull request is how a
# release is made: it bumps the version everywhere it is written, tags it, publishes the release
# notes, and then this workflow builds the desktop app's installers for Linux, macOS and Windows
# and attaches them to the release.
#
# The next version and the changelog come from commit messages on main, which start with what
# kind of change they are: `fix:` for a bug fix (0.1.0 -> 0.1.1), `feat:` for something new
# (0.1.0 -> 0.2.0), and `docs:`, `ci:`, `chore:`, `test:` or `refactor:` for what users don't see.
#
# Running this by hand from the Actions tab builds the installers without releasing anything,
# for trying a build; they are kept with the run as downloads.
#
# The macOS build is signed and notarized when these repository secrets are set, and unsigned
# otherwise: APPLE_CERTIFICATE (the Developer ID certificate as base64), APPLE_CERTIFICATE_PASSWORD,
# APPLE_ID, APPLE_PASSWORD (an app-specific password) and APPLE_TEAM_ID. The app is signed as
# whoever the certificate names, so there is no separate identity to keep in step with it.
# The Windows build is unsigned.
#
# Installed apps update themselves from the newest release. Each build is signed for that with
# the repository secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, and
# apps accept only what that key signed (its public half is in src-tauri/tauri.conf.json). The
# build fails without them. Losing the key means installed apps can no longer be updated, so a
# copy is kept outside GitHub.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  installers:
    name: Installers (${{ matrix.name }})
    needs: release
    # After a release was just made, or when run by hand (the release job is skipped then).
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.created == 'true')
    runs-on: ${{ matrix.os }}
    # A build takes about ten minutes. Notarizing with Apple usually adds a few more, but has no
    # limit of its own, so this stops a run that is waiting on Apple from waiting for hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the Linux packages run on older systems too.
          - name: Linux
            os: ubuntu-22.04
            args: ''
          # One app for both Apple silicon and Intel Macs.
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin/package-lock.json
      - run: npm ci
      # The interface shares the command's maths typesetter, which is installed with the plugin.
      - run: npm ci
        working-directory: plugin

      # Signing is switched on only when the certificate is there, so the build works without it.
      - name: Set up macOS signing
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      # With a tag, the installers are attached to that release; without one they are only built.
      - id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release.outputs.tag }}
          # The setup program is what the site offers on Windows, so it is what updates use too.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Keep the installers from a run by hand
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: ${{ join(fromJSON(steps.build.outputs.artifactPaths), fromJSON('"\n"')) }}
          if-no-files-found: error

  # A release is made as a pre-release, which GitHub does not count as the newest one, so apps,
  # the website and setup keep using the previous release while the installers are built and
  # attached. Only when every installer is there does it become the newest release. If any build
  # fails, it stays a pre-release and nothing points at it.
  publish:
    name: Publish the release
    needs: [release, installers]
    if: needs.release.outputs.created == 'true' && needs.installers.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.release.outputs.tag }}" --repo "${{ github.repository }}" --prerelease=false --latest

  # `stable` is a tag that always points at the newest release. Anthropic's plugin directory
  # follows it, so a listing gets each release and never the work in between that sits on main.
  # It is a tag and not a branch because this workflow's own sign-in may not push a branch whose
  # history changes workflow files, which a release often does.
  stable:
    name: Point stable at the release
    needs: [release, publish]
    if: needs.release.outputs.created == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/stable" -f sha="${{ github.sha }}" -F force=true \
            || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref=refs/tags/stable -f sha="${{ github.sha }}"
