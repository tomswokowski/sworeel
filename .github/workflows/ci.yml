# Checks every change: the command and core on all three systems, the desktop app's own code on Linux.
#
# It also runs once a day with nothing changed here. The plugin runs inside Claude Code, which
# updates on its own schedule, so a new Claude Code can break the plugin without a commit to
# blame. The daily run installs the newest one and fails, with an email, the day that happens.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  command:
    name: Command and core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: plugin
      - name: Type check
        if: runner.os == 'Linux'
        run: npm run type-check
      - name: Test
        run: npm test
      # The in-session pane and what Claude is told run inside Claude Code, so its own test
      # runner checks them. Neither step signs in or talks to a model.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Check the plugin
        run: claude plugin validate --strict ./plugin
      - name: Test the pane
        run: claude plugin test ./plugin

  app:
    name: Desktop app (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The app embeds the built interface, so it has to exist before the Rust code compiles.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: plugin
      - run: npm run build
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Test
        run: cargo test
        working-directory: src-tauri
